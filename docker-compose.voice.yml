version: '3.8'

# ============================================================
# TeamFlow — Standalone Voice (WebRTC, no external APIs)
# ============================================================

services:
  # ------------------------------------------------------------
  # WebRTC Gateway (mediasoup — replaces Asterisk entirely)
  # ------------------------------------------------------------
  webrtc-gateway:
    build:
      context: ./services/webrtc-gateway
      dockerfile: Dockerfile
    container_name: teamflow-webrtc
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      - WEBRTC_PORT=3004
      - MEDIASOUP_LISTEN_IP=0.0.0.0
      # Set announced IP to your server's public IP for WebRTC穿透
      - MEDIASOUP_ANNOUNCED_IP=${WEBRTC_ANNOUNCED_IP:-127.0.0.1}
      - NODE_ENV=production
    networks:
      - teamflow-net

  # ------------------------------------------------------------
  # Voice Agent (AI calling — now WebRTC-first)
  # ------------------------------------------------------------
  voice-agent:
    build:
      context: ./services/voice-agent
      dockerfile: Dockerfile
    container_name: teamflow_voice_agent
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - DATABASE_URL=${DATABASE_URL}
      # WebRTC gateway (no Asterisk needed)
      - WEBRTC_GATEWAY_URL=http://webrtc-gateway:3004
      # STT / TTS / LLM — all self-hosted
      - WHISPER_URL=http://whisper:9000
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - PIPER_URL=http://piper:5000
      - PIPER_VOICE=${PIPER_VOICE:-en_US-amy-medium}
      - LLM_PROVIDER=${LLM_PROVIDER:-minimax}
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:latest}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - MINIMAX_API_KEY=${MINIMAX_API_KEY:-}
      - MINIMAX_MODEL=${MINIMAX_MODEL:-MiniMax-Text-01}
    volumes:
      - voice_recordings:/app/recordings
    depends_on:
      - postgres
      - webrtc-gateway
    networks:
      - teamflow-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ------------------------------------------------------------
  # Database
  # ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: teamflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: teamflow
      POSTGRES_USER: teamflow_user
      POSTGRES_PASSWORD: teamflow_pass_2026
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./services/voice-agent/src/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - teamflow-net

  # ------------------------------------------------------------
  # AI Services (all self-hosted, no external API costs)
  # ------------------------------------------------------------
  whisper:
    image: ghcr.io/openai/whisper:main
    container_name: teamflow_whisper
    ports:
      - "9000:9000"
    command: --api --model base --host 0.0.0.0 --port 9000
    volumes:
      - whisper_models:/root/.cache/whisper
    networks:
      - teamflow-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G

  piper:
    image: ghcr.io/rhasspy/piper-parakeet:latest
    container_name: teamflow_piper
    ports:
      - "5000:5000"
    volumes:
      - piper_models:/app
    command: --model en_US-amy-medium.onnx --device cpu --online 0.0.0.0 5000
    networks:
      - teamflow-net
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: teamflow_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - teamflow-net
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 8G
    command: serve

networks:
  teamflow-net:
    driver: bridge

volumes:
  voice_recordings:
  pgdata:
  whisper_models:
  piper_models:
  ollama_models: