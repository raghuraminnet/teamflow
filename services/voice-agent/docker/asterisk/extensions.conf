[general]
static=yes
writeprotect=no
autofallthrough=yes

[teamflow-inbound]
exten => s,1,Answer()
exten => s,n,Wait(1)
exten => s,n,Playback(agent-login)
exten => s,n,WaitExten(10)
exten => 1,1,Goto(teamflow-ivr-main,s,1)
exten => i,1,Playback(invalid)
exten => s,n,Goto(s,1)
exten => t,1,Playback(goodbye)

[teamflow-ivr-main]
exten => s,1,Answer()
exten => s,n,Wait(1)
exten => s,n,Playback(press-1-for)
exten => s,n,Playback(support)
exten => s,n,Playback(press-2-for)
exten => s,n,Playback(sales)
exten => s,n,WaitExten(5)
exten => 1,1,Playback(connecting-support)
exten => 1,n,AGI(agi://voice-agent/support)
exten => 1,n,Hangup()
exten => 2,1,Playback(connecting-sales)
exten => 2,n,AGI(agi://voice-agent/sales)
exten => 2,n,Hangup()
exten => i,1,Playback(invalid)
exten => s,n,Goto(s,1)
exten => t,1,Playback(goodbye)

[teamflow-outbound]
exten => s,1,Answer()
exten => s,n,Wait(1)
exten => s,n,AGI(agi://voice-agent/outbound)
exten => s,n,Hangup()

[teamflow-transfer]
exten => _X.,1,Dial(SIP/${EXTEN},30,T)
exten => _X.,n,Hangup()
